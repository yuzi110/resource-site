<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在前往资源站...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 加载动画 */
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #e1e4e8;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .content {
            text-align: center;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 14px; color: #666; margin-bottom: 24px; }

        .btn {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }

        /* 微信/QQ 引导遮罩 */
        #wx-guide {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 9999;
            color: #fff;
            padding-top: 20px;
            padding-right: 30px;
        }

        .guide-arrow {
            position: absolute;
            top: 10px;
            right: 20px;
            width: 60px;
            height: auto;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0) rotate(10deg);}
            40% {transform: translateY(-10px) rotate(10deg);}
            60% {transform: translateY(-5px) rotate(10deg);}
        }

        .guide-text {
            float: right;
            clear: right;
            margin-top: 70px;
            background: #fff;
            color: #000;
            padding: 20px;
            border-radius: 12px;
            width: 260px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .guide-text::before {
            content: '';
            position: absolute;
            top: -8px;
            right: 20px;
            width: 16px;
            height: 16px;
            background: #fff;
            transform: rotate(45deg);
        }
        .guide-step {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .step-num {
            background: #000;
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- 正常浏览器显示的内容 -->
    <div id="main-content" style="display: none;">
        <div class="loader"></div>
        <div class="content">
            <h1>正在跳转到严选资源站...</h1>
            <p>如果长时间未响应，请点击下方按钮</p>
            <a href="/" id="jump-link" class="btn">立即前往</a>
        </div>
    </div>

    <!-- 微信/QQ 引导遮罩 -->
    <div id="wx-guide">
        <!-- 手绘风格箭头 SVG -->
        <svg class="guide-arrow" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50 80 Q 70 40 90 10 M 90 10 L 60 25 M 90 10 L 75 40" />
        </svg>

        <div class="guide-text">
            <h3 style="font-size: 16px; margin-bottom: 15px; font-weight: bold;">请在浏览器打开</h3>
            <div class="guide-step">
                <span class="step-num">1</span>
                <span>点击右上角的 <strong style="font-size: 18px; vertical-align: middle;">···</strong> 按钮</span>
            </div>
            <div class="guide-step">
                <span class="step-num">2</span>
                <span>选择 <strong>在浏览器打开</strong></span>
            </div>
            <div class="guide-step" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; color: #888; font-size: 12px;">
                <span style="width: 100%; text-align: center; display: block;">即可访问海量资源</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var isWeChat = /micromessenger/i.test(ua);
            var isQQ = /qq\//i.test(ua) || /mqqbrowser/i.test(ua); // 简单的QQ内置浏览器判断
            
            // 获取目标链接 (支持 ?target=/blog/1 这样的参数)
            var urlParams = new URLSearchParams(window.location.search);
            var targetPath = urlParams.get('target') || '/';
            // 确保 targetPath 是相对路径或同域路径，防止开放重定向漏洞（简单过滤）
            if (targetPath.indexOf('http') === 0) {
                targetPath = '/';
            }
            
            var jumpLink = document.getElementById('jump-link');
            jumpLink.href = targetPath;

            if (isWeChat || (isQQ && !/miniprogram/i.test(ua))) {
                // 如果是微信或QQ，显示引导层
                document.getElementById('wx-guide').style.display = 'block';
                document.title = "请在浏览器打开";
            } else {
                // 如果是正常浏览器，显示跳转提示并自动跳转
                document.getElementById('main-content').style.display = 'flex';
                
                // 延迟 500ms 跳转，给用户一点视觉反馈，也避免某些浏览器拦截
                setTimeout(function() {
                    window.location.href = targetPath;
                }, 500);
            }
        })();
    </script>
</body>
</html>
