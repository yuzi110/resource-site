<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在搬运资源...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }

        /* 动画区域 - 飞机绕地球旋转 */
        .animation-container {
            width: 200px;
            height: 200px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px auto;
            /* 水平居中，底部留白 */
        }

        /* 地球 */
        .earth {
            width: 80px;
            height: 80px;
            font-size: 80px;
            line-height: 80px;
            z-index: 1;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* 轨道 */
        .orbit {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 2px dashed #e5e7eb;
            border-radius: 50%;
            animation: rotate 6s linear infinite;
        }

        /* 飞机 */
        .plane-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            animation: rotate-plane 4s linear infinite;
        }

        .plane {
            position: absolute;
            top: -16px;
            /* 轨道半径调整 */
            left: 50%;
            font-size: 32px;
            transform: translateX(-50%) rotate(90deg);
            /* 调整飞机朝向 */
        }

        @keyframes rotate-plane {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* 文案 */
        .text-container {
            max-width: 400px;
            width: 100%;
            /* 确保在小屏幕下也能居中 */
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
            margin: 0 auto;
            /* 水平居中 */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 加载中三个点动画 */
        .dots::after {
            content: '.';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60% {
                content: '...';
            }

            80%,
            100% {
                content: '';
            }
        }

        .info-box {
            background-color: #f9fafb;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #f3f4f6;
            text-align: left;
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .info-box p {
            margin-bottom: 8px;
        }

        .highlight {
            color: #374151;
            font-weight: bold;
        }

        .red-highlight {
            color: #ef4444;
            font-weight: bold;
        }

        hr {
            border: 0;
            border-top: 1px solid #e5e7eb;
            margin: 10px 0;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            color: #9ca3af;
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            margin-top: 7px;
            flex-shrink: 0;
        }

        .dot-black {
            background-color: #000;
        }

        .dot-red {
            background-color: #ef4444;
        }

        /* 微信引导遮罩 */
        #wx-guide {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            color: white;
        }

        .arrow-icon {
            position: absolute;
            top: 20px;
            right: 30px;
            width: 80px;
            height: 80px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        .guide-card {
            background: white;
            color: black;
            padding: 24px;
            border-radius: 16px;
            width: 80%;
            max-width: 300px;
            margin-top: 80px;
            position: relative;
        }

        .guide-card::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 30px;
            width: 16px;
            height: 16px;
            background: white;
            transform: rotate(45deg);
        }
    </style>
</head>

<body>

    <!-- 主内容区 -->
    <div id="main-content" style="display: none;">
        <div class="animation-container">
            <div class="earth">🌏</div>
            <div class="orbit"></div>
            <div class="plane-wrapper">
                <div class="plane">✈️</div>
            </div>
        </div>

        <div class="text-container">
            <h2>正在搬运资源<span class="dots"></span></h2>

            <div class="info-box">
                <p>🚀 网站正从遥远的<span class="highlight">阿米利卡</span>搬运过来，要跨过大海、翻过珠峰，第一次加载会有点慢。</p>
                <p>🍲 但<span class="highlight">好菜不怕晚</span>，请稍安勿躁。</p>
                <hr>
                <div class="list-item">
                    <div class="dot dot-black"></div>
                    <p>首页展示均为<span class="highlight">免费日常资源</span>。</p>
                </div>
                <div class="list-item">
                    <div class="dot dot-red"></div>
                    <p>如果你从 <span class="red-highlight">V</span> 来的，加载完成后可迅速点击右上角的 <span
                            style="background:#e5e7eb; padding:0 4px; border-radius:4px; color:#374151;">📖 专栏</span>
                        到达你的目的地。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 微信引导遮罩 -->
    <div id="wx-guide">
        <!-- 手绘风格大箭头 -->
        <svg class="arrow-icon" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M50 80 Q 70 40 90 10 M 90 10 L 60 25 M 90 10 L 75 40" />
        </svg>

        <div class="guide-card">
            <h3
                style="font-size: 20px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                请在浏览器打开
            </h3>
            <p style="font-size: 14px; color: #4b5563; margin-bottom: 16px;">
                点击右上角菜单 <strong style="color: black;">···</strong>
            </p>
            <div
                style="background: #f3f4f6; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px;">
                <div
                    style="background: #3b82f6; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">
                    1</div>
                <span style="font-size: 14px; font-weight: 500;">选择“在浏览器打开”</span>
            </div>
        </div>
        <div style="margin-top: 40px; color: rgba(255,255,255,0.5); font-size: 12px;">Resource Site Premium</div>
    </div>

    <script>
        (function () {
            var ua = navigator.userAgent.toLowerCase();
            var isWeChat = /micromessenger/i.test(ua);
            var isQQ = /qq\//i.test(ua) || /mqqbrowser/i.test(ua);
            var isMiniProgram = /miniprogram/i.test(ua);

            // 获取目标链接
            var urlParams = new URLSearchParams(window.location.search);
            var targetPath = urlParams.get('target') || '/';
            // 安全检查
            if (targetPath.indexOf('http') === 0) {
                try {
                    var targetUrl = new URL(targetPath);
                    if (targetUrl.origin !== window.location.origin) {
                        targetPath = '/';
                    } else {
                        targetPath = targetUrl.pathname + targetUrl.search;
                    }
                } catch (e) { targetPath = '/'; }
            }

            // 显示页面内容（解决 CSS 未加载完乱码问题）
            document.body.style.opacity = '1';

            if ((isWeChat || isQQ) && !isMiniProgram) {
                document.getElementById('wx-guide').style.display = 'flex';
                document.title = "请在浏览器打开";
            } else {
                // 正常浏览器，显示 Loading 动画
                document.getElementById('main-content').style.display = 'flex';
                document.body.style.overflow = 'hidden'; // 防止滚动

                // 进度条数字跳动逻辑
                // var percentageEl = document.getElementById('percentage');
                // var progress = 0;
                // 模拟加载逻辑：
                // 1. 前 3 秒快速跑到 80% (假动画)
                // 2. 然后停在 99% 等待真正的页面跳转 (真加载)
                // 3. 页面跳转发生时，guide.html 会被销毁，用户感知就是 100% 后切换了

                // 延迟 2.5 秒后再发起真正的跳转，让用户至少看 2.5 秒的飞机动画
                // 这样避免“一闪而过”或者“白屏”
                setTimeout(function () {
                    window.location.href = targetPath;
                }, 2500);
            }
        })();
    </script>
</body>

</html>
