<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在搬运资源...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* 动画区域 */
        .animation-container {
            width: 100%;
            max-width: 320px;
            height: 120px;
            position: relative;
            margin-bottom: 30px;
        }

        .border-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #e5e7eb;
        }

        .plane {
            position: absolute;
            bottom: 0;
            font-size: 32px;
            transform: translate(-50%, 50%) rotate(-45deg);
            /* 使用简单的 CSS animation 模拟 JS 的进度 */
            animation: fly 10s linear forwards; 
        }

        /* 纯 CSS 飞机图标 (用 emoji 代替 SVG 以减少代码量，或者画一个简单的) */
        .plane-icon {
            display: inline-block;
            transform: rotate(-45deg); 
        }

        .mountain-1 {
            position: absolute;
            bottom: 0;
            left: 10px;
            font-size: 40px;
            color: #d1d5db;
            line-height: 1;
        }
        .mountain-2 {
            position: absolute;
            bottom: 0;
            right: 20px;
            font-size: 50px;
            color: #d1d5db;
            line-height: 1;
        }

        @keyframes fly {
            0% { left: 0%; }
            100% { left: 100%; }
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            max-width: 320px;
            height: 8px;
            background-color: #f3f4f6;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background-color: #000;
            width: 0%;
            animation: progress 10s linear forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .percentage {
            font-family: monospace;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* 文案 */
        .text-container {
            max-width: 400px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 18px; font-weight: bold; margin-bottom: 15px; }

        .info-box {
            background-color: #f9fafb;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #f3f4f6;
            text-align: left;
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }

        .info-box p { margin-bottom: 8px; }
        .highlight { color: #374151; font-weight: bold; }
        .red-highlight { color: #ef4444; font-weight: bold; }

        hr { border: 0; border-top: 1px solid #e5e7eb; margin: 10px 0; }

        .list-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #9ca3af; }
        .dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
        .dot-black { background-color: #000; }
        .dot-red { background-color: #ef4444; }

        /* 微信引导遮罩 */
        #wx-guide {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(4px);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            color: white;
        }
        
        .arrow-icon {
            position: absolute;
            top: 20px;
            right: 30px;
            width: 60px;
            height: 60px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        .guide-card {
            background: white;
            color: black;
            padding: 24px;
            border-radius: 16px;
            width: 80%;
            max-width: 300px;
            margin-top: 80px;
            position: relative;
        }
        
        .guide-card::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 30px;
            width: 16px;
            height: 16px;
            background: white;
            transform: rotate(45deg);
        }

    </style>
</head>
<body>

    <!-- 主内容区 -->
    <div id="main-content" style="display: none;">
        <div class="animation-container">
            <div class="border-bottom"></div>
            <div class="mountain-1">⛰️</div>
            <div class="mountain-2">🏔️</div>
            <div class="plane">✈️</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="percentage" id="percentage">0%</div>

        <div class="text-container">
            <h2>正在搬运资源...</h2>
            
            <div class="info-box">
                <p>🌏 网站正从遥远的<span class="highlight">阿米利卡</span>搬运过来，要跨过大海、翻过珠峰，第一次加载会有点慢。</p>
                <p>🍲 但<span class="highlight">好菜不怕晚</span>，请稍安勿躁。</p>
                <hr>
                <div class="list-item">
                    <div class="dot dot-black"></div>
                    <p>首页展示均为<span class="highlight">免费日常资源</span>。</p>
                </div>
                <div class="list-item">
                    <div class="dot dot-red"></div>
                    <p>如果你从 <span class="red-highlight">V</span> 来的，加载完成后可迅速点击右上角的 <span style="background:#e5e7eb; padding:0 4px; border-radius:4px; color:#374151;">📖 专栏</span> 到达你的目的地。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 微信引导遮罩 -->
    <div id="wx-guide">
        <svg class="arrow-icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
            <path d="M669.5 596.5c-9.8 0-19.1-5.7-23.7-15.5L528.2 284c-5.9-12.7 3.4-27.5 17.5-27.5h16.7c9.8 0 19.1 5.7 23.7 15.5l117.6 297c5.9 12.7-3.4 27.5-17.5 27.5h-16.7z" fill="#ffffff" transform="rotate(30 600 600)"></path>
            <path d="M545.9 334.3l202.9 203.9c10.5 10.5 27.5 10.5 38 0 10.5-10.5 10.5-27.5 0-38l-202.9-203.9c-10.5-10.5-27.5-10.5-38 0-10.5 10.5-10.5 27.5 0 38z" fill="#ffffff"></path>
        </svg>

        <div class="guide-card">
            <h3 style="font-size: 20px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                ⚠️ 无法访问
            </h3>
            <p style="font-size: 14px; color: #4b5563; margin-bottom: 16px;">
                由于平台限制，请点击右上角菜单 <strong style="color: black;">···</strong>
            </p>
            <div style="background: #f3f4f6; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px;">
                <div style="background: #3b82f6; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">1</div>
                <span style="font-size: 14px; font-weight: 500;">选择“在浏览器打开”</span>
            </div>
        </div>
        <div style="margin-top: 40px; color: rgba(255,255,255,0.5); font-size: 12px;">Resource Site Premium</div>
    </div>

    <script>
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var isWeChat = /micromessenger/i.test(ua);
            var isQQ = /qq\//i.test(ua) || /mqqbrowser/i.test(ua);
            var isMiniProgram = /miniprogram/i.test(ua);

            // 获取目标链接
            var urlParams = new URLSearchParams(window.location.search);
            var targetPath = urlParams.get('target') || '/';
            // 安全检查
            if (targetPath.indexOf('http') === 0) {
                try {
                    var targetUrl = new URL(targetPath);
                    if (targetUrl.origin !== window.location.origin) {
                        targetPath = '/';
                    } else {
                        targetPath = targetUrl.pathname + targetUrl.search;
                    }
                } catch(e) { targetPath = '/'; }
            }

            if ((isWeChat || isQQ) && !isMiniProgram) {
                document.getElementById('wx-guide').style.display = 'flex';
                document.title = "请在浏览器打开";
            } else {
                // 正常浏览器，显示 Loading 动画
                document.getElementById('main-content').style.display = 'flex';
                document.body.style.overflow = 'hidden'; // 防止滚动

                // 进度条数字跳动逻辑
                var percentageEl = document.getElementById('percentage');
                var progress = 0;
                var duration = 3000; // 假装加载3秒 (根据实际白屏时间调整，用户说有10几秒，这里设个3-5秒过渡，剩下的是真实请求时间)
                // 其实这里的加载只是个动画，真实的加载是下面的 window.location.href 触发的请求
                // 为了让用户看到 Loading 页面，我们需要先显示页面，再执行跳转
                
                var startTime = Date.now();
                var timer = setInterval(function() {
                    var elapsed = Date.now() - startTime;
                    progress = Math.min((elapsed / duration) * 100, 99);
                    percentageEl.innerText = Math.floor(progress) + '%';
                    
                    if (progress >= 99) {
                        clearInterval(timer);
                    }
                }, 50);

                // 立即触发跳转，利用浏览器加载新页面时的“保留当前页”特性
                // 当新页面（首页）HTML 下载并解析完成前，浏览器通常会保留当前页面（即 guide.html）
                // 这样用户看到的就是 Loading 动画，直到首页 Ready，瞬间切换
                setTimeout(function() {
                    window.location.href = targetPath;
                }, 100); // 稍微延时一点点确保动画开始渲染
            }
        })();
    </script>
</body>
</html>
